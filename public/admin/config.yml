# =============================================================================
# Decap CMS — panel de administración de contenido para CarpinteroPro
# =============================================================================
# Panel tipo CRM en /admin: completas el formulario, das clic en "Publish" y
# el CMS crea/edita el archivo correspondiente directamente en el repositorio
# (commit real a Git). Ver CMS_SETUP.md para la configuración necesaria antes
# de poder usarlo (Netlify Identity + Git Gateway).
#
# IMPORTANTE — slugs entre idiomas: para que el selector de idioma del sitio
# funcione correctamente, una misma pieza de contenido en español e inglés
# debe usar el MISMO "URL Slug" en ambos idiomas (ej. "closets-a-medida" en
# services/es Y en services/products). El campo "URL Slug" de cada colección
# está pensado exactamente para eso — compruébalo antes de publicar.
# =============================================================================

backend:
  name: git-gateway
  branch: main

# Los archivos que suba un editor (imágenes, etc.) se guardan aquí y quedan
# servidos públicamente en /images/uploads/...
media_folder: 'public/images/uploads'
public_folder: '/images/uploads'

site_url: https://carpinteropro.com
display_url: https://carpinteropro.com

locale: 'es'

collections:
  # ---------------------------------------------------------------------------
  # BLOG
  # ---------------------------------------------------------------------------
  - name: 'blog_es'
    label: 'Blog (Español)'
    label_singular: 'Artículo'
    folder: 'src/content/blog/es'
    path: '{{slug}}/index'
    slug: '{{year}}-{{month}}-{{day}}-{{fields.urlSlug}}'
    extension: 'mdx'
    format: 'frontmatter'
    create: true
    identifier_field: title
    fields:
      - { label: 'Título', name: 'title', widget: 'string' }
      - { label: 'URL Slug', name: 'urlSlug', widget: 'string', hint: 'Sólo minúsculas y guiones, ej. guia-completa-closets', pattern: ['^[a-z0-9-]+$', 'Sólo minúsculas, números y guiones'] }
      - { label: 'Descripción (meta description)', name: 'description', widget: 'text' }
      - { label: 'Fecha de publicación', name: 'publishDate', widget: 'datetime' }
      - { label: 'Fecha de actualización', name: 'updatedDate', widget: 'datetime', required: false }
      - { label: 'Autor', name: 'author', widget: 'string', default: 'Equipo CarpinteroPro' }
      - label: 'Categoría'
        name: 'category'
        widget: 'select'
        options: ['carpinteria', 'muebles-a-medida', 'cocinas', 'closets', 'gabinetes', 'madera', 'diseno', 'reparaciones', 'consejos', 'proyectos', 'inspiracion']
      - label: 'Tipo de artículo'
        name: 'type'
        widget: 'select'
        options: ['guide', 'howto', 'project', 'beforeafter', 'video', 'gallery', 'faq', 'comparison', 'inspiration', 'news', 'casestudy']
        default: 'guide'
      - { label: 'Tags', name: 'tags', widget: 'list', default: [] }
      - { label: 'Destacado en home', name: 'featured', widget: 'boolean', default: false }
      - { label: 'Borrador (no se publica)', name: 'draft', widget: 'boolean', default: true }
      - { label: 'Imagen destacada', name: 'heroImage', widget: 'image', required: false }
      - { label: 'Texto alternativo de la imagen', name: 'heroImageAlt', widget: 'string', required: false }
      - label: 'Galería'
        name: 'gallery'
        widget: 'list'
        required: false
        fields:
          - { label: 'Imagen', name: 'src', widget: 'image' }
          - { label: 'Texto alternativo', name: 'alt', widget: 'string' }
          - { label: 'Leyenda', name: 'caption', widget: 'string', required: false }
      - { label: 'ID de YouTube', name: 'youtube', widget: 'string', required: false, hint: 'Sólo el ID del vídeo, ej. dQw4w9WgXcQ' }
      - { label: 'Palabras clave (SEO)', name: 'keywords', widget: 'list', required: false }
      - { label: 'Servicios relacionados (slugs)', name: 'relatedServices', widget: 'list', required: false }
      - { label: 'Productos relacionados (slugs)', name: 'relatedProducts', widget: 'list', required: false }
      - { label: 'Artículos relacionados (slugs)', name: 'relatedPosts', widget: 'list', required: false }
      - { label: 'Ubicación', name: 'location', widget: 'string', required: false }
      - { label: 'Título SEO (opcional)', name: 'seoTitle', widget: 'string', required: false }
      - { label: 'Descripción SEO (opcional)', name: 'seoDescription', widget: 'string', required: false }
      - { label: 'Contenido', name: 'body', widget: 'markdown' }

