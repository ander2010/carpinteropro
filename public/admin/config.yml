      - { label: 'SEO keywords', name: 'keywords', widget: 'list', required: false }
      - { label: 'Related services (slugs)', name: 'relatedServices', widget: 'list', required: false }
      - { label: 'Related products (slugs)', name: 'relatedProducts', widget: 'list', required: false }
      - { label: 'Related posts (slugs)', name: 'relatedPosts', widget: 'list', required: false }
      - { label: 'Location', name: 'location', widget: 'string', required: false }
      - { label: 'SEO title (optional)', name: 'seoTitle', widget: 'string', required: false }
      - { label: 'SEO description (optional)', name: 'seoDescription', widget: 'string', required: false }
