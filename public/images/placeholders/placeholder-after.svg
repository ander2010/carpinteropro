<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="Imagen 'después' de referencia, pendiente de sustituir">
  <defs>
    <linearGradient id="bgA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c88a45"/>
      <stop offset="1" stop-color="#925e29"/>
    </linearGradient>
    <pattern id="hatchA" width="36" height="36" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="36" stroke="#1d1912" stroke-opacity="0.12" stroke-width="14"/>
    </pattern>
  </defs>
  <rect width="1200" height="900" fill="url(#bgA)"/>
  <rect width="1200" height="900" fill="url(#hatchA)"/>
  <text x="600" y="460" text-anchor="middle" font-family="Georgia, serif" font-size="34" fill="#1d1912">DESPUÉS</text>
  <text x="600" y="500" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#2b2418">Foto de referencia</text>
</svg>
